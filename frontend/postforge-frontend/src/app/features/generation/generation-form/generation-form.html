<div class="page-container">
  <header class="page-header">
    <div>
      <h1>Générer un carrousel</h1>
      <p class="subtitle">Transforme un sujet technique en carrousel LinkedIn prêt à publier</p>
    </div>
    <button class="link-button" (click)="goToHistory()">📜 Historique</button>
  </header>

  <div class="form-card">
    <form (ngSubmit)="onSubmit()" #genForm="ngForm">
      <div class="form-group">
        <label for="topic">Sujet</label>
        <input
          type="text"
          id="topic"
          name="topic"
          [(ngModel)]="topic"
          required
          placeholder="Ex: Le pattern Singleton"
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="language">Langue</label>
          <select id="language" name="language" [(ngModel)]="language">
            <option value="fr">🇫🇷 Français</option>
            <option value="en">🇬🇧 English</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tone">Ton</label>
          <select id="tone" name="tone" [(ngModel)]="tone">
            <option value="expert">🎓 Expert</option>
            <option value="debutant">🌱 Débutant</option>
          </select>
        </div>
      </div>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button type="submit" class="submit-btn" [disabled]="genForm.invalid || isLoading()">
        @if (isLoading()) {
          <span class="spinner"></span> Génération en cours...
        } @else {
          ✨ Générer le carrousel
        }
      </button>
    </form>
  </div>

  @if (result(); as res) {
    <div class="result-section">
      <h2>{{ res.topic }}</h2>
      <app-carousel-viewer
        [slides]="res.rawOutput.slides"
        [ctaSlide]="res.rawOutput.cta_slide"
        [hashtags]="res.rawOutput.suggested_hashtags"
        [topic]="res.topic"
      ></app-carousel-viewer>
    </div>
  }
</div>
