spring:
  application:
    name: postforge-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/postforge
    username: ${DB_USERNAME:postforge}
    password: ${DB_PASSWORD:postforge}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}

jwt:
  secret: ${JWT_SECRET:changeme-in-production-use-env-var}
  expiration-ms: 86400000

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}