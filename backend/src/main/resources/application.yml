spring:
  application:
    name: postforge-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/postforge
    username: ${DB_USERNAME:postforge}
    password: ${DB_PASSWORD:postforge}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080


ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}

jwt:
  secret: ${JWT_SECRET:changeme-in-production-use-env-var}
  expiration-ms: 86400000
